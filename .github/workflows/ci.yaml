# CI jobs

name: C unit tests

on:
  push:
    branches: [main]

jobs:
  unit_tests:
    runs_on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: latest
          platform: x64
      - name: Run test.sh
        run: ./test.sh
